<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <!-- ADD YOUR HTML CODE INSIDE OF THIS DIV -->
            <div class="post-it purple">
                <h2 id="Goals">Goals</h2>
                <ul>
                    <li>Reach 100 subs</li>
                    <li>get better at editing</li>
                    <li>save $500</li>
                </ul>              
            </div>
            <div class="post-it green">
                <img 
                    src="images/Shift at midnight.jpg" 
                    alt=" im scurred!!!"
                    width="160"
                >
                <h3>Good Video</h3>               
            </div>
            <div class="post-it">
                <h2>ToDo:</h2>
                <p>clothes shopping friday!</p>               
            </div>
            <br>
            <div class="post-it cyan">
                <h2>Remember to edit!</h2>                
            </div>
            <div class="post-it pink">
                <h3>"Believe in yourself.." Someone Somewhere</h3>                  
            </div>
           
            <div class="post-it orange a-little-right">
                <h4>GOT WORK @ 6AM</h4>                
            </div>
            <div class="post-it empty">               
            </div>
        </div>
    </body>
</html>
