<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mebay Product Page</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <!-- flexbox container -->
        <div id="three-column">
            <!-- flexbox item -->
            <div id="thumbnail-column">
                <img 
                    src="images/ps3-img-gallery.webp" 
                    alt=""
                >
                <img 
                    src="images/ps3-galery-img-3.webp" 
                    alt=""
                >
                <img 
                    src="images/ps3-img-gallery-4.webp" 
                    alt=""
                >

            </div>
            <!-- flexbox item -->
            <div id="featured-image-column">
                <img 
                    src="images/ps3-main-image.webp" 
                    alt=""
                >
            </div>
            <!-- flexbox item -->
            <div id="product-info-column">
                <h2 id="product-name">
                    GUARANTEED WARRANTY Sony PlayStation 3 PS3 Slim Console - 
                    Pick HDD size 120- 320
                </h2>
                <hr>
                <p>Gamerzhavencom</p>
                <a href="#" class="seller-info">99.1% positive</a>
                <a href="#" class="seller-info">Sellers other items</a>
                <a href="#" class="seller-info space">Contact seller</a>
                <hr>
                <h2>US $139.99</h2>
                <p>Condition: New</p>
           
                <a href="#" class="button-1">Buy It Now</a>
                <a href="#" class="button-2">Add to Cart</a>
                <a href="#" class="button-2">Add to Wishlist</a>
            </div>
        </div>
    </body>
</html>
