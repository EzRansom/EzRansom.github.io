<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media and Text</title>
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- page layout container -->
    <div id="single-column">
        <!-- flexbox container -->
        <div id="side-by-side-1">

            <img src="images/cereal-3.jpg" alt="cereal">
            <!-- flexbox item 2 -->
            <h2>Dosen't this look delicious</h2>

        </div>
        <!-- flex box container -->
        <div id="side-by-side-2">

            <!-- flexbox item -->
            <div class="image-container">
                <img src="images/cereal-3.jpg" alt="cereal">
            </div>

            <!-- flexbox item -->
            <div class="text-box-container">
                <h2>Dosen't this look delicious</h2>
                <p>
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. 
                    suscipit optio incidunt.
            </p>
            </div>
        </div>
    </div>
</body>

</html>
