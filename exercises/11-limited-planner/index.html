<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Limmited Planner</title>
        <link href="css/style.css" rel="stylesheet">    
    </head>
    <body>
        <div id="morning">
            <h2>My Morning To-Do List</h2>
            <div>
                <ul>
                    <li class="important completed">Brush Teeth</li>
                    <li class="completed">Feed the dog</li>
                    <li>
                        Get dressed for work
                        <a href="#" class="button">Complete</a>
                    </li>
                </ul>
            </div>
        </div>
        <div id="afternoon">
            <h2>My Afternoon To-Do List</h2>
            <div>
                <ul>
                    <li class="important completed">Shower</li>
                    <li>Nap <a href="#" class="button">Complete</a></li>
                    <li class="completed">Get ready for class</li>
                </ul>
            </div>
        </div>
        <div id="evening">
            <h2>My Evening To-Do List</h2>
            <div>
                <ul>
                    <li class="important completed">Brush Teeth</li>
                    <li>
                        Change to Pj's <a href="#" class="button">Complete</a>
                    </li>
                    <li class="important">
                        Set alarm for 5:00AM 
                        <a href="#" class="button">Complete</a>
                    </li>
                </ul>
            </div>
        </div>
    </body>
</html>
