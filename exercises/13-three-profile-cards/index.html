<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Three Profile Cards</title>
        <link href="css/style.css" rel="stylesheet">    
    </head>
    <body>
        <div id="single-column">
            <!-- flexbox container -->
            <div id="card-container">

                <!-- flexbox item -->
                <div class="card">
                    <h3>Ken Takakura (Okarun)</h3>
                    <img
                        class="profile-pic"
                        width="190" 
                        src="images/Okarun.webp" 
                        alt="Okarun"
                    >
                    <p>
                        "I'm an awkward guy..."
                    </p>
                    <div class="button">
                        <a href="#"> View Profile</a>
                    </div>
                </div>

                <!-- flexbox item -->
                <div class="card">
                    <h3>Momo Ayase (Best Girl)</h3>
                    <img
                        class="profile-pic"
                        width="200" 
                        src="images/momo.png" 
                        alt="Okarun"
                    >
                    <p>
                        "I was abducted by aliens!!!"
                    </p>
                    <div class="button">
                        <a href="#"> View Profile</a>
                    </div>
                </div>

                <!-- flexbox item -->
                <div class="card">
                    <h3>LuckyCat (TurboGranny)</h3>
                    <img
                        class="profile-pic"
                        width="200" 
                        src="images/cat.png" 
                        alt="Okarun"
                    >
                    <p>
                        "I'm just here for the food!..."
                    </p>
                    <div class="button column">
                        <a href="#"> View Profile</a>
                    </div>
                </div>
            </div>
        </div>
     
    </body>
</html>
